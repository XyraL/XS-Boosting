<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XS-Boosting</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="hidden">

<!-- Shown in the world while a contract runs. Never takes focus. -->
<div id="hud" class="hud hidden" data-side="left"></div>

<div id="app" class="app hidden" data-theme="blue">

  <div id="boot" class="boot hidden">
    <div class="boot__frame">
      <div class="boot__mark">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 14l1.6-4.8A3 3 0 0 1 7.4 7h9.2a3 3 0 0 1 2.8 2.2L21 14v4h-3v-2H6v2H3v-4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="7.5" cy="14" r="1.3" fill="currentColor"/>
          <circle cx="16.5" cy="14" r="1.3" fill="currentColor"/>
        </svg>
      </div>
      <div class="boot__lines" id="bootLines"></div>
      <div class="boot__bar"><i></i></div>
    </div>
  </div>

  <div id="unit" class="unit hidden">

    <header class="status">
      <div class="status__identity">
        <span class="status__dot"></span>
        <span class="status__name">XS-Boosting</span>
        <span class="status__build" id="statusBuild">v0.3.0</span>
      </div>

      <div class="status__ticker" id="ticker" aria-live="off"></div>

      <div class="status__right">
        <div class="pill pill--rep">
          <span class="pill__label">rep</span>
          <span class="pill__value" id="statusRep">0</span>
        </div>
        <div class="pill pill--tier">
          <span class="pill__label">tier</span>
          <span class="pill__value" id="statusTier">—</span>
        </div>
        <div class="clock" id="statusClock">00:00</div>
        <button class="iconbtn" id="btnClose" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="body">
      <nav class="dock" id="dock" role="tablist">
        <div class="dock__brand">
          <span class="dock__brandmark">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 14l1.6-4.8A3 3 0 0 1 7.4 7h9.2a3 3 0 0 1 2.8 2.2L21 14v4h-3v-2H6v2H3v-4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/>
              <circle cx="7.5" cy="14" r="1.3" fill="currentColor"/>
              <circle cx="16.5" cy="14" r="1.3" fill="currentColor"/>
            </svg>
          </span>
          <span>
            <b>XS-Boosting</b>
            <small id="brandLine">Vehicle contracts</small>
          </span>
        </div>

        <div class="dock__section">Market</div>

        <button class="dock__item is-active" data-go="home" role="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v9H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 20v-5h4v5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Overview</span>
          <span></span>
        </button>

        <button class="dock__item" data-go="board" role="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="14" width="16" height="5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Board</span>
          <span></span>
        </button>

        <button class="dock__item" data-go="market" role="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-6 4 3 7-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Rates</span>
          <span></span>
        </button>

        <div class="dock__section">Operations</div>

        <button class="dock__item" data-go="job" role="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Contract</span>
          <i class="dock__flag hidden" id="dockJobFlag"></i>
        </button>

        <button class="dock__item" data-go="crew" role="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5M15 19c0-2.2 1.4-3.7 3.3-3.7 1.3 0 2.2.5 2.2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
          <span>Crew</span>
          <span></span>
        </button>

        <div class="dock__section">You</div>

        <button class="dock__item" data-go="record" role="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v16l-5-3-5 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span>Record</span>
          <span></span>
        </button>

        <button class="dock__item" data-go="settings" role="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5v2M12 18.5v2M20.5 12h-2M5.5 12h-2M18 6l-1.4 1.4M7.4 16.6 6 18M18 18l-1.4-1.4M7.4 7.4 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Settings</span>
          <span></span>
        </button>

        <button class="dock__me" id="dockMe" data-go="profile">
          <span class="avatar" id="dockFace"></span>
          <span>
            <b id="dockName">—</b>
            <small id="dockSub">No handle</small>
          </span>
          <span class="chev">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </button>
      </nav>

      <main class="stage" id="stage">
        <section class="panel is-active" data-panel="home"></section>
        <section class="panel" data-panel="board"></section>
        <section class="panel" data-panel="market"></section>
        <section class="panel" data-panel="job"></section>
        <section class="panel" data-panel="crew"></section>
        <section class="panel" data-panel="record"></section>
        <section class="panel" data-panel="profile"></section>
        <section class="panel" data-panel="settings"></section>
      </main>
    </div>

    <footer class="statusline">
      <div class="statusline__seg is-acc" id="slMode">Connected</div>
      <div class="statusline__seg" id="slInfo">Idle</div>
      <div class="statusline__seg push" id="slJob">No contract</div>
      <div class="statusline__seg" id="slHint">Esc to close</div>
    </footer>
  </div>

  <div id="builder" class="builder hidden"></div>

  <div id="placing" class="placing hidden">
    <div class="placing__card">
      <div class="placing__pulse"></div>
      <h3>Placing</h3>
      <p>Look where you want it and press <b>E</b>. <b>Backspace</b> to back out.</p>
    </div>
  </div>

  <div id="minigame" class="minigame hidden"></div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</div>

<script src="js/core.js"></script>
<!-- Preview data. Inert in game: XS.post only routes here when the page is
     opened in a browser, where GetParentResourceName does not exist. -->
<script src="js/mock.js"></script>
<script src="js/avatars.js"></script>
<script src="js/hud.js"></script>
<script src="js/minigames.js"></script>
<script src="js/hack.js"></script>
<script src="js/panels/home.js"></script>
<script src="js/panels/board.js"></script>
<script src="js/panels/job.js"></script>
<script src="js/panels/crew.js"></script>
<script src="js/panels/market.js"></script>
<script src="js/panels/stats.js"></script>
<script src="js/panels/profile.js"></script>
<script src="js/panels/settings.js"></script>
<script src="js/panels/builder.js"></script>
<script src="js/panels/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
